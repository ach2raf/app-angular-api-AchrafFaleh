<div class="bg-dark min-vh-100">
<h1 class="text-warning mb-4 text-center">Vehicles</h1>

<div class="row g-3">
    @for(veh of vehicleList(); track veh.name) {
    <div class="col-md-3">
        <app-vehicles-item-component [vehicle]="veh"
        (vehicleClicked)="openVehicleModal($event)"></app-vehicles-item-component>
    </div>
    }
</div>
</div>
